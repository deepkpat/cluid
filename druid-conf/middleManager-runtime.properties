# middleManager runtime.properties override (via DRUID_CONFIG_middleManager).
# Based on the image's single-server/micro-quickstart file, tuned for a
# small bench box: 1 task slot, slim peon heaps (full-size 1g peons OOM a
# 7GB Docker Desktop host when combined with the other services).
druid.service=druid/middleManager
druid.plaintextPort=8091

# Number of tasks per middleManager
druid.worker.capacity=1
druid.worker.baseTaskDirs=["var/druid/task"]

# Task launch parameters
druid.indexer.runner.javaOptsArray=["-server","-Xms256m","-Xmx512m","-XX:MaxDirectMemorySize=512m","-Duser.timezone=UTC","-Dfile.encoding=UTF-8","-XX:+ExitOnOutOfMemoryError","-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager"]

# HTTP server threads
druid.server.http.numThreads=12

# Processing threads and buffers on Peons
druid.indexer.fork.property.druid.processing.numMergeBuffers=2
druid.indexer.fork.property.druid.processing.buffer.sizeBytes=100MiB
druid.indexer.fork.property.druid.processing.numThreads=1

# Hadoop indexing
druid.indexer.task.hadoopWorkingPath=var/druid/hadoop-tmp
