# Common runtime.properties override for coordinator + overlord.
# Based on the image's single-server/micro-quickstart/_common file, with:
#   - ZooKeeper pointing at the compose `zk` service
#   - metadata storage on shared postgres (Derby can't be shared across two
#     containers), incl. the postgresql-metadata-storage extension
# Mounted via DRUID_CONFIG_COMMON (druid.sh copies it over the generated one).
druid.extensions.loadList=["druid-hdfs-storage", "druid-kafka-indexing-service", "druid-datasketches", "druid-multi-stage-query", "druid-parquet-extensions", "postgresql-metadata-storage"]
druid.host=localhost
druid.startup.logging.logProperties=true
druid.zk.service.host=zk
druid.zk.paths.base=/druid
druid.metadata.storage.type=postgresql
druid.metadata.storage.connector.connectURI=jdbc:postgresql://druid-metadata:5432/druid
druid.metadata.storage.connector.user=druid
druid.metadata.storage.connector.password=druid
druid.storage.type=local
druid.storage.storageDirectory=var/druid/segments
druid.indexer.logs.type=file
druid.indexer.logs.directory=var/druid/indexing-logs
druid.selectors.indexing.serviceName=druid/overlord
druid.selectors.coordinator.serviceName=druid/coordinator
druid.monitoring.monitors=["org.apache.druid.java.util.metrics.JvmMonitor", "org.apache.druid.server.metrics.ServiceStatusMonitor"]
druid.emitter=noop
druid.emitter.logging.logLevel=info
druid.indexing.doubleStorage=double
druid.server.hiddenProperties=["druid.s3.accessKey","druid.s3.secretKey","druid.metadata.storage.connector.password", "password", "key", "token", "pwd"]
druid.sql.enable=true
druid.sql.planner.useGroupingSetForExactDistinct=true
druid.lookup.enableLookupSyncOnStartup=false
